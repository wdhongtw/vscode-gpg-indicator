name: check-code-quality

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ main ]

jobs:

  check:
    runs-on: ubuntu-24.04
    steps:

      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Node.js environment
        uses: actions/setup-node@v5.0.0
        with:
          node-version: 22.23

      - name: Install dependent packages
        run: npm install

      - name: Run lint job
        run: npm run lint

      - name: Run test job
        run: npm run test
